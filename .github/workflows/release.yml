# ─────────────────────────────────────────────────────────────────────────────
# Chorus Engine — Release Workflow
# ─────────────────────────────────────────────────────────────────────────────
# Triggered on version tag pushes (v*). Runs the full test suite, builds and
# pushes Docker images to GHCR (CPU + GPU), and creates a GitHub Release with
# auto-generated release notes.
#
# This ensures that every git tag has a corresponding GitHub Release and that
# container images are always published for tagged versions.
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:

  # ── Test ──────────────────────────────────────────────────────────────────────
  # Run the full test suite before publishing anything.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # No ad-hoc installs here. A bare "pip install librosa soundfile scipy
          # numpy openai-whisper" used to follow, which resolved those five
          # packages afresh and overrode the pins in requirements.txt, so the one
          # build that produces the released artefact tested versions other than
          # the ones it ships. The line above already installs the pinned set.

      - name: Run tests
        run: pytest --tb=short

  # ── Docker Publish ───────────────────────────────────────────────────────────
  # Builds CPU and GPU images, tags with version + latest, pushes to GHCR.
  # Only runs on major releases (v3.0.0, v4.0.0, etc.), not point/minor releases.
  # This reduces CI friction and runner disk pressure for patch releases.
  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    needs: test
    if: ${{ endsWith(github.ref, '.0.0') && !contains(github.ref, '-') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Build and push CPU image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chorus:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/chorus:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push GPU image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: Dockerfile.gpu
          target: runtime-gpu
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chorus:${{ steps.version.outputs.tag }}-gpu
            ghcr.io/${{ github.repository_owner }}/chorus:latest-gpu
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── GitHub Release ───────────────────────────────────────────────────────────
  # Creates a GitHub Release with auto-generated notes from merged PRs/commits.
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [test, docker-publish]
    if: ${{ !cancelled() && needs.test.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.docker-publish.result) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" &>/dev/null; then
            echo "Release ${TAG} already exists — skipping creation."
          else
            gh release create "${TAG}" \
              --title "Chorus ${TAG}" \
              --generate-notes \
              --verify-tag
          fi

  # ── Post-release Consistency Check ─────────────────────────────────────────
  # Runs strict version/release/documentation consistency checks once release
  # publication has completed.
  post-release-consistency:
    name: Post-release Consistency
    runs-on: ubuntu-latest
    needs: [test, github-release]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.github-release.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Strict version consistency check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tests/version_consistency_test.sh --ci
