version: 2

# v6.0.0 is the final release, so routine version-bump PRs are switched off
# (limit 0). GitHub security alerts and security-update PRs are configured
# separately and keep running.

updates:
  # Python package updates
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "python"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "github-actions"
